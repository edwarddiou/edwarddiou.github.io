<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500"
     font-family="-apple-system, 'Helvetica Neue', 'PingFang TC', 'Microsoft JhengHei', 'Noto Sans CJK TC', sans-serif">
  <defs>
    <radialGradient id="dataFill" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.12"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ============ TITLE ============ -->
  <text x="300" y="34" text-anchor="middle" fill="#e6e8ec" font-size="18" font-weight="600" letter-spacing="0.5">
    業務表現評分 · 五大維度雷達
  </text>
  <text x="300" y="56" text-anchor="middle" fill="#97a3b6" font-size="12" font-style="italic">
    示意圖 · 分數僅作示範用途，非實際量測值
  </text>

  <!-- ============ GRID (4 concentric pentagons) ============ -->
  <g fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="1">
    <polygon points="300,230 338.04,257.64 323.52,302.36 276.48,302.36 261.96,257.64"/>
    <polygon points="300,190 376.08,245.28 347.04,334.72 252.96,334.72 223.92,245.28"/>
    <polygon points="300,150 414.12,232.92 370.56,367.08 229.44,367.08 185.88,232.92"/>
  </g>
  <polygon points="300,110 452.16,220.56 394.08,399.44 205.92,399.44 147.84,220.56"
           fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>

  <!-- ============ AXES ============ -->
  <g stroke="rgba(255,255,255,0.12)" stroke-width="1">
    <line x1="300" y1="270" x2="300"    y2="110"/>
    <line x1="300" y1="270" x2="452.16" y2="220.56"/>
    <line x1="300" y1="270" x2="394.08" y2="399.44"/>
    <line x1="300" y1="270" x2="205.92" y2="399.44"/>
    <line x1="300" y1="270" x2="147.84" y2="220.56"/>
  </g>

  <!-- ============ TICK LABELS (along top axis) ============ -->
  <g fill="#5b6577" font-size="10" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', monospace">
    <text x="307" y="234">25</text>
    <text x="307" y="194">50</text>
    <text x="307" y="154">75</text>
    <text x="307" y="114">100</text>
  </g>

  <!-- ============ DATA POLYGON ============ -->
  <polygon points="300,150 429.30,228.00 351.70,341.20 215.30,386.50 201.10,237.90"
           fill="url(#dataFill)" stroke="#22d3ee" stroke-width="2" stroke-linejoin="round"
           filter="url(#glow)"/>

  <!-- ============ DATA POINTS ============ -->
  <g stroke="#0e1219" stroke-width="2">
    <circle cx="300"    cy="150"    r="5" fill="#22d3ee"/>
    <circle cx="429.30" cy="228.00" r="5" fill="#22d3ee"/>
    <circle cx="351.70" cy="341.20" r="5" fill="#22d3ee"/>
    <circle cx="215.30" cy="386.50" r="5" fill="#22d3ee"/>
    <circle cx="201.10" cy="237.90" r="5" fill="#22d3ee"/>
  </g>

  <!-- ============ SCORE LABELS NEXT TO DATA POINTS ============ -->
  <g fill="#67e8f9" font-size="12" font-weight="700"
     font-family="ui-monospace, 'SF Mono', 'Cascadia Code', monospace">
    <text x="312" y="143" text-anchor="start">75</text>
    <text x="441" y="223" text-anchor="start">85</text>
    <text x="362" y="344" text-anchor="start">55</text>
    <text x="205" y="392" text-anchor="end">90</text>
    <text x="189" y="232" text-anchor="end">65</text>
  </g>

  <!-- ============ AXIS LABELS (5 dimensions) ============ -->
  <g fill="#e6e8ec" font-size="14" font-weight="500">
    <text x="300" y="88"  text-anchor="middle">產品推薦合理性</text>
    <text x="468" y="216" text-anchor="start">場景應對契合度</text>
    <text x="398" y="423" text-anchor="start">顧客信任度變化</text>
    <text x="202" y="423" text-anchor="end">專業態度表現</text>
    <text x="132" y="216" text-anchor="end">需求挖掘深度</text>
  </g>

  <!-- ============ FOOTER NOTE ============ -->
  <text x="300" y="478" text-anchor="middle" fill="#5b6577" font-size="11">
    每項分數 0–100 · 加總呈現整場對話的綜合表現
  </text>
</svg>
